# ============================================================
# News Auto-Pipeline — Source Configuration
# ============================================================
# Each source has:
#   name:          Display name (used in logs and DB)
#   url:           Homepage URL
#   feed_url:      RSS/Atom feed URL (null if none — triggers Tier 2)
#   tier:          1 = RSS+trafilatura (fast, free)  |  2 = ScrapeGraphAI (slow, uses Gemini quota)
#   category:      Content category for image generation context
#   subreddit:     Target subreddit for Reddit posting
#   delay_seconds: Pause between requests to this source (robots.txt courtesy)
#   max_articles:  Max articles to pull per run from this source
# ============================================================

sources:
  # --- Tier 1: RSS + trafilatura (fast, free) ---

  - name: "TechCrunch"
    url: "https://techcrunch.com"
    feed_url: "https://techcrunch.com/feed/"
    tier: 1
    category: "tech"
    subreddit: "technology"
    delay_seconds: 2
    max_articles: 5

  - name: "The Verge"
    url: "https://www.theverge.com"
    feed_url: "https://www.theverge.com/rss/index.xml"
    tier: 1
    category: "tech"
