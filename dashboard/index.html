<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewsFlow — Automation Pipeline Dashboard</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="dark-theme">

  <div class="app-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <i data-lucide="zap"></i>
        </div>
        <div class="brand-info">
          <h2>NewsFlow</h2>
          <span class="version-badge">v1.0 • Gemini 2.5</span>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="#articles" class="nav-item" data-page="articles">
          <i data-lucide="newspaper"></i>
          <span>Articles</span>
          <span class="nav-badge" id="nav-count-articles">0</span>
        </a>
        <a href="#sources" class="nav-item" data-page="sources">
          <i data-lucide="rss"></i>
          <span>Sources</span>
          <span class="nav-badge muted">18</span>
        </a>
        <a href="#queue" class="nav-item" data-page="queue">
          <i data-lucide="layers"></i>
          <span>Local Queue</span>
          <span class="nav-badge warning" id="nav-count-queue">0</span>
        </a>
        <a href="#logs" class="nav-item" data-page="logs">
          <i data-lucide="terminal"></i>
          <span>System Logs</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="cost-badge">
          <i data-lucide="piggy-bank"></i>
          <span>Monthly Cost: <strong>$0.00</strong></span>
        </div>
        <div class="system-status">
          <span class="status-indicator online"></span>
          <span>Pipeline Engine Ready</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-title">
          <h1 id="page-title">Dashboard Overview</h1>
          <p id="page-subtitle">Real-time automation analytics and content pipeline status</p>
        </div>

        <div class="header-actions">
          <div class="pipeline-status-banner" id="pipeline-status-banner">
            <span class="dot-pulse green"></span>
            <span id="pipeline-status-text">Idle</span>
          </div>

          <button id="run-pipeline-btn" class="btn btn-primary btn-glow">
            <i data-lucide="play"></i>
            <span>Run Pipeline</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <div id="page-container" class="page-container">
        <!-- Content will be injected dynamically via JavaScript -->
      </div>

    </main>
  </div>

  <!-- Article Detail Modal -->
  <div id="article-modal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content glass-card">
      <div class="modal-header">
        <div>
          <span class="badge" id="modal-status-badge">READY</span>
          <h2 id="modal-article-title">Article Title</h2>
          <div class="modal-meta" id="modal-article-meta">Source • Category</div>
        </div>
        <button class="btn-icon" id="modal-close-btn">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-article-body">
        <!-- Dynamic content injected here -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScript Modules -->
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/articles.js"></script>
  <script src="/js/pages/sources.js"></script>
  <script src="/js/pages/queue.js"></script>
  <script src="/js/pages/logs.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
